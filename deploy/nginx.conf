server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # sonde Kubernetes
  location = /healthz { access_log off; add_header Content-Type text/plain; return 200 "ok\n"; }

  # pages de l'export statique : /demo -> demo.html
  location / { try_files $uri $uri.html $uri/ =404; }

  # fichiers versionnés par Next.js et médias : cache long
  location /_next/static/ { expires 1y; add_header Cache-Control "public, immutable"; }
  location /images/ { expires 30d; add_header Cache-Control "public"; }
  location /videos/ { expires 30d; add_header Cache-Control "public"; }

  error_page 404 /404.html;
}
