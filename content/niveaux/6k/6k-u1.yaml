        texte: "Le guide de la FFAAA réunit les règles du dojo : en retard, on attend au bord du tapis que l'enseignant fasse signe ; on attend en seiza ; on vient avec une tenue propre et sans bijoux ; on range ses armes et on n'emprunte pas la tenue ou les armes d'un autre. Beaucoup de ces règles protègent les partenaires."
