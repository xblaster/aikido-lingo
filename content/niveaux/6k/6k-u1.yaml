        titre: Le salut, porte d'entrée du dojo
        texte: "Le guide de la FFAAA demande de saluer en montant sur le tapis et en le quittant, en direction du shomen ou du portrait du fondateur. Ce salut debout s'appelle ritsurei. Le salut n'est pas une formalité : il marque le passage du monde extérieur à la pratique, et le respect du lieu et des partenaires."
