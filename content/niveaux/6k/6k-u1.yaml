      note:
        titre: Révision
        texte: "Saluer en montant et en quittant le tapis, s'asseoir en seiza, dire onegai shimasu et arigato gozaimashita, respecter les règles du dojo : c'est le reishiki."
    exercises:
      - id: ex-6k-u1-l8-1
        type: technique_decoder
        prompt: Shomen veut dire « face avant ». Dans le nom d'attaque « shomen uchi », que vise la frappe ?
        jpText: Shomen uchi ikkyo
        decomposition:
          attaque: shomen uchi
          technique: ikkyo
        options:
          - id: o1
            text: le ventre
          - id: o2
            text: le devant (le haut) de la tête
          - id: o3
            text: le côté de la tête
        correctAnswer: le devant (le haut) de la tête
        explanation: "Shomen (face avant) + uchi (frappe) : frappe verticale au sommet de la tête. La frappe sur le côté est yokomen uchi, le coup au ventre chudan tsuki."
        sources:
          - type: web
            ref: NWU-GLOSS
            url: https://www.earth.northwestern.edu/public/craig/aikido/glossary.html
            consulte: 2026-10-19
