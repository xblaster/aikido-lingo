  - id: 6k-u1-l3
    title: Seiza et zarei
    subtitle: Seiza
    description: S'asseoir à genoux et saluer depuis cette position.
    icon: Armchair
    xpReward: 20
    focus: Seiza et salut à genoux
    isReview: false
    research: niveaux/6k/6k-u1/recherche/6k-u1-l3.md
    auteur:
      session: contenu-6k-2026-10-19
      date: 2026-10-19
    intro:
      termes:
        - jp: Seiza
          kanji: 正座
          fr: assis à genoux, sur les talons, le dos droit
          illustration:
            image: scenes/seiza
            emoji: 🧎
            alt: Un pratiquant assis à genoux sur ses talons, dos droit, mains posées sur les cuisses, vu de profil.
          source:
            type: ouvrage
            ref: BUDOKAN-II
            url: https://www.nipponbudokan.or.jp/pdf/shidosho/aikido/Aikido-02.pdf
            consulte: 2026-10-19
        - jp: Zarei
          kanji: 座礼
          fr: salut à genoux, depuis seiza
          illustration:
            image: scenes/zarei
            emoji: 🙇
            alt: Deux partenaires en seiza face à face s'inclinent, mains posées devant eux sur le tatami.
          source:
            type: ouvrage
            ref: BUDOKAN-II
            url: https://www.nipponbudokan.or.jp/pdf/shidosho/aikido/Aikido-02.pdf
            consulte: 2026-10-19
        - jp: Reiho
          kanji: 礼法
          fr: manières de saluer et de se tenir
          source:
            type: ouvrage
            ref: BUDOKAN-II
            url: https://www.nipponbudokan.or.jp/pdf/shidosho/aikido/Aikido-02.pdf
            consulte: 2026-10-19
      note:
        titre: La position du salut
        texte: "Seiza est la position assise de base : à genoux, assis sur les talons. Le salut fait dans cette position s'appelle zarei. Le manuel du Nippon Budokan commence l'enseignement de base par ces manières de saluer (reiho). Le guide FFAAA demande aussi d'attendre en seiza, par exemple pendant les explications."
      points:
        - "Seiza : à genoux, assis sur les talons."
        - "Zarei : salut depuis seiza."
        - On attend souvent en seiza.
    exercises:
      - id: ex-6k-u1-l3-1
        type: image_choice
        prompt: "Choisissez l'illustration : « Zarei »"
        jpText: Zarei
        options:
          - id: o1
            text: Ritsurei
            illustration:
              image: scenes/ritsurei
              emoji: 🙇
              alt: Un pratiquant debout s'incline au bord du tatami.
          - id: o2
            text: Zarei
            illustration:
              image: scenes/zarei
              emoji: 🙇
              alt: Deux partenaires en seiza face à face s'inclinent, mains posées devant eux.
          - id: o3
            text: Seiza
            illustration:
              image: scenes/seiza
              emoji: 🧎
              alt: Un pratiquant assis sur ses talons, dos droit, mains sur les cuisses.
        correctAnswer: Zarei
        explanation: Zarei est le salut à genoux ; seiza est la position assise sans salut ; ritsurei est le salut debout.
        sources:
          - type: ouvrage
            ref: BUDOKAN-II
            url: https://www.nipponbudokan.or.jp/pdf/shidosho/aikido/Aikido-02.pdf
            consulte: 2026-10-19
          - type: federation
            ref: FFAAA-GUIDE
            url: http://www.aikido-idf-ffaaa.fr/media/2019/02/aikido-ffaaa-guide-debutant.pdf
            page: "23"
            consulte: 2026-10-19
      - id: ex-6k-u1-l3-2
        type: meaning_choice
        prompt: Que signifie « seiza » ?
        jpText: Seiza
        options:
          - id: o1
            text: assis à genoux, sur les talons
          - id: o2
            text: debout, un pied en avant
          - id: o3
            text: déplacement à genoux
        correctAnswer: assis à genoux, sur les talons
        explanation: Seiza 正座. Le pied en avant, c'est le hanmi ; le déplacement à genoux, le shikko.
        sources:
          - type: ouvrage
            ref: BUDOKAN-II
            url: https://www.nipponbudokan.or.jp/pdf/shidosho/aikido/Aikido-02.pdf
            consulte: 2026-10-19
      - id: ex-6k-u1-l3-3
        type: term_choice
        prompt: Quel terme désigne le salut à genoux ?
        frText: Le salut fait depuis la position assise à genoux
        options:
          - id: o1
            text: ritsurei
          - id: o2
            text: kamiza
          - id: o3
            text: zarei
        correctAnswer: zarei
        sources:
          - type: ouvrage
            ref: BUDOKAN-II
            url: https://www.nipponbudokan.or.jp/pdf/shidosho/aikido/Aikido-02.pdf
            consulte: 2026-10-19
          - type: federation
            ref: FFAAA-GUIDE
            url: http://www.aikido-idf-ffaaa.fr/media/2019/02/aikido-ffaaa-guide-debutant.pdf
            page: "25"
            consulte: 2026-10-19
      - id: ex-6k-u1-l3-4
        type: kanji_choice
        prompt: Comment se lit ce mot ?
        kanji: 座礼
        options:
          - id: o1
            text: reiho
            translation: manières de saluer
          - id: o2
            text: zarei
            translation: salut à genoux
          - id: o3
            text: seiza
            translation: assis à genoux
        correctAnswer: zarei
        explanation: "座 (s'asseoir) + 礼 (salut) : zarei. Seiza s'écrit 正座, reiho 礼法."
        sources:
          - type: ouvrage
            ref: BUDOKAN-II
            url: https://www.nipponbudokan.or.jp/pdf/shidosho/aikido/Aikido-02.pdf
            consulte: 2026-10-19
      - id: ex-6k-u1-l3-5
        type: order_steps
        prompt: Remettez dans l'ordre.
