        type: scenario
        prompt: Quelle attitude ?
        frText: Vous êtes tori. Votre uke débute et chute avec difficulté.
        options:
          - id: o1
            text: Je garde ma vitesse habituelle
          - id: o2
            text: Je change de partenaire sans rien dire
          - id: o3
            text: Je ralentis et j'adapte la technique à son niveau
        correctAnswer: Je ralentis et j'adapte la technique à son niveau
        sources:
