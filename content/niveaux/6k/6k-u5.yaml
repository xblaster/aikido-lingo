            url: https://aikikai.or.jp/aikido/
            consulte: 2026-10-19
      note:
        titre: Chuter au bon moment
        texte: "À deux, uke chute sous l'action de tori, et non de lui-même par anticipation : le Budokan insiste sur ce point. Tori, de son côté, adapte sa vitesse au niveau de uke. Si quelque chose ne va pas, on s'arrête et on le dit."
