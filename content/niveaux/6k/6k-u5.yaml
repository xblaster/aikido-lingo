  - id: 6k-u5-l4
    title: Chuter avec un partenaire
    subtitle: Uke
    description: Chuter sous l'action de tori, en sécurité.
    icon: Users
    xpReward: 20
    focus: Chuter sous l'action du partenaire
    isReview: false
