      termes:
        - jp: Ukemi
          kanji: 受身
          fr: art de chuter pour se protéger et se remettre vite en position
          source:
            type: ouvrage
            ref: BUDOKAN-VII
            url: https://www.nipponbudokan.or.jp/pdf/shidosho/aikido/Aikido-07.pdf
            consulte: 2026-10-19
      note:
        titre: Bien chuter, c'est se protéger
        texte: "Ukemi est l'art de chuter : le manuel du Nippon Budokan en fait un moyen de se protéger et de se relever vite. Uke, en recevant la technique, chute. Les chutes s'apprennent progressivement, sur le tatami, sous la conduite de l'enseignant : cette application en donne le vocabulaire, pas le geste."
      points:
        - Ukemi protège celui qui chute.
        - On se relève vite, prêt à continuer.
        - Le geste s'apprend avec l'enseignant, progressivement.
