      note:
        titre: Une main, une saisie
        texte: "Katate : une main ; dori : saisie. Dans la nomenclature de la CSDGE, « katate dori » seul désigne la saisie en gyaku hanmi : uke saisit avec la main opposée (sa main droite sur le poignet gauche de tori, ou l'inverse). C'est l'une des attaques du 5e kyu FFAB. La CSDGE regroupe les attaques sous le nom de kogekiho."
