          - id: o2
            text: ai hanmi
          - id: o3
            text: à genoux
        correctAnswer: gyaku hanmi
        explanation: La CSDGE précise « ai hanmi » quand la saisie se fait en garde identique ; sans précision, c'est gyaku hanmi.
