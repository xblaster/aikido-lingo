      note:
        titre: Le demi-corps
        texte: "Hanmi (半身, « demi-corps ») est la garde de base : une jambe en avant, le corps légèrement de profil. On parle de migi hanmi quand le pied droit est devant, de hidari hanmi quand c'est le gauche. On travaille toujours des deux côtés."
