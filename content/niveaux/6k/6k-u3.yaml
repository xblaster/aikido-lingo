  - id: 6k-u3-l3
    title: Ai hanmi et gyaku hanmi
    subtitle: Ai hanmi
    description: La garde des deux partenaires l'un par rapport à l'autre.
    icon: Users
    xpReward: 20
    focus: Même pied devant ou pieds opposés
    isReview: false
    research: niveaux/6k/6k-u3/recherche/6k-u3-l3.md
    auteur:
      session: contenu-6k-2026-10-19
      date: 2026-10-19
    intro:
      termes:
        - jp: Ai hanmi
          kanji: 相半身
          fr: tori et uke ont le même pied devant
          illustration:
            image: scenes/ai-hanmi
            emoji: 🧍
            alt: Deux partenaires face à face en garde, tous deux pied droit devant, à distance de garde ; les pieds sont visibles.
          source:
            type: ouvrage
            ref: BUDOKAN-VII
            url: https://www.nipponbudokan.or.jp/pdf/shidosho/aikido/Aikido-07.pdf
            consulte: 2026-10-19
        - jp: Gyaku hanmi
          kanji: 逆半身
          fr: tori et uke ont des pieds opposés devant
          illustration:
            image: scenes/gyaku-hanmi
            emoji: 🧍
            alt: Deux partenaires face à face en garde, l'un pied droit devant, l'autre pied gauche devant ; les pieds sont visibles.
          source:
            type: ouvrage
            ref: BUDOKAN-VII
            url: https://www.nipponbudokan.or.jp/pdf/shidosho/aikido/Aikido-07.pdf
            consulte: 2026-10-19
      note:
        titre: Se regarder les pieds
        texte: "Face à face, si les deux partenaires ont le même pied devant (droit et droit, ou gauche et gauche), ils sont en ai hanmi. S'ils ont des pieds opposés devant, ils sont en gyaku hanmi. Ce placement donne son nom à certaines attaques : ai hanmi katate dori, gyaku hanmi katate dori."
    exercises:
      - id: ex-6k-u3-l3-1
        type: image_choice
        prompt: "Choisissez l'illustration : « Gyaku hanmi »"
        jpText: Gyaku hanmi
        options:
          - id: o1
            text: Ai hanmi
            illustration:
              image: scenes/ai-hanmi
              emoji: 🧍
              alt: Deux partenaires face à face, tous deux pied droit devant.
          - id: o2
            text: Seiza
            illustration:
              image: scenes/seiza
              emoji: 🧎
              alt: Un pratiquant assis sur ses talons, dos droit.
          - id: o3
            text: Gyaku hanmi
            illustration:
              image: scenes/gyaku-hanmi
              emoji: 🧍
              alt: Deux partenaires face à face, l'un pied droit devant, l'autre pied gauche devant.
        correctAnswer: Gyaku hanmi
        explanation: "Gyaku : inversé. Les pieds avant sont opposés."
        sources:
          - type: ouvrage
            ref: BUDOKAN-VII
            url: https://www.nipponbudokan.or.jp/pdf/shidosho/aikido/Aikido-07.pdf
            consulte: 2026-10-19
