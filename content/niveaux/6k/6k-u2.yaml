        texte: "En France, la FFAB et la FFAAA comptent six kyu : on commence au 6e et l'on progresse jusqu'au 1er. Les kyu sont délivrés en club par l'enseignant. Viennent ensuite les dan ; le premier, shodan, veut dire « le début ». Les dan sont délivrés par la CSDGE, commission commune aux deux fédérations. Au Hombu Dojo de l'Aikikai, il n'y a que cinq kyu."
