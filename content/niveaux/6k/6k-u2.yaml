  - id: 6k-u2-l5
    title: Les kyu et les dan
    subtitle: Kyu
    description: "Comment on progresse : six kyu, puis les dan."
    icon: Award
    xpReward: 20
    focus: Kyu délivrés en club, dan par la CSDGE
    isReview: false
    research: niveaux/6k/6k-u2/recherche/6k-u2-l5.md
    auteur:
      session: contenu-6k-2026-10-19
      date: 2026-10-19
    intro:
      termes:
        - jp: Kyu
          kanji: 級
          fr: grade avant les dan (du 6e au 1er kyu en France)
          source:
            type: federation
            ref: FFAAA-GRADES
            url: https://aikido.com.fr/grades/
            consulte: 2026-10-19
