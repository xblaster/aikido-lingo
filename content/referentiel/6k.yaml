# Référentiel du niveau 6e kyu. Rédigé le 2026-10-19 à partir de : Budokan (manuel aïkido, chap. Ⅰ-Ⅱ, Ⅶ),
# FFAAA (guide du débutant, page Grades), FFAB (page Grades KYU), FLAM (programme kyu 2011, étiquette),
# CSDGE Livre 2 (critères d'évaluation), Aikikai (What is Aikido?, Examination Guidelines).
#
# IMPORTANT — pourquoi ce niveau n'a pas de « programme officiel » technique :
#  - FFAB et FFAAA annoncent six kyu avant le 1er dan, mais aucune ne publie de contenu pour le 6e kyu
#    (la FFAB détaille du 5e au 1er kyu ; la FFAAA ne publie pas de programme kyu, délivré en club) ;
#  - l'Aikikai Hombu Dojo ne compte que cinq kyu (5e → 1er) ;
#  - la FLAM fait commencer son programme au 5e kyu (« 20 cours depuis l'inscription ») et compte
#    les heures de stage du shodan « depuis le 6e kyu » : le 6e kyu y apparaît comme le point de départ.
# Le niveau 6K de l'application couvre donc les FONDAMENTAUX préalables au 5e kyu, chacun sourcé :
# étiquette, postures, déplacements, chutes, rôles tori/uke et noms des premières attaques.
# Aucun de ces éléments n'est présenté comme « exigé au 6e kyu ».
level: 6K
nom: "6e kyu"
