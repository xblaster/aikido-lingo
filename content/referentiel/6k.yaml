themes:   # 5 unités (contrat : 5 × 8 leçons, la 8e = révision)
  - unite: "Le dojo et l'étiquette"
    lecons: ["Entrer au dojo et saluer", "Le kamiza et le shomen", "Seiza et zarei", "Onegai shimasu, arigato gozaimashita", "Pendant le cours : écouter, attendre, changer de partenaire", "La tenue : keikogi, obi, hakama", "Sensei, sempai, kohai"]
  - unite: "Qu'est-ce que l'aïkido ?"
    lecons: ["Ai, ki, do : le sens du mot", "Le fondateur, Ueshiba Morihei", "Tori et uke", "Pas de compétition", "Les kyu et les dan", "Les fédérations : FFAB, FFAAA, FLAM, Aikikai", "Compter en japonais"]
  - unite: "Postures"
    lecons: ["Kamae", "Hanmi : droite et gauche", "Ai hanmi et gyaku hanmi", "Seiza et kiza", "Ma ai : la distance", "Tegatana : la main-sabre", "Le regard et la vigilance (zanshin)"]
  - unite: "Se déplacer"
    lecons: ["Okuri ashi", "Ayumi ashi", "Tenkai ashi", "Tenkan ashi et tenkan", "Irimi et tenkan", "Shikko", "Tai sabaki sur katate dori"]
  - unite: "Chuter et premières attaques"
    lecons: ["Pourquoi chuter : ukemi", "Ushiro ukemi", "Mae ukemi", "Chuter avec un partenaire", "Katate dori", "Ai hanmi katate dori", "Shomen uchi"]

