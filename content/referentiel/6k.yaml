    techniques: ["Reiho : seiza, zarei", "Kamae : hanmi (ai hanmi, gyaku hanmi)", "Tai sabaki : okuri ashi, ayumi ashi, tenkai ashi, tenkan ashi, tenkan", "Ukemi : ushiro ukemi, mae ukemi, ukemi roulées avant/arrière", "Kiza et shikko"]
    source: { ref: "Nippon Budokan, 少年少女武道指導書 合気道, chap. Ⅱ 基本指導 §1-5", url: "https://www.nipponbudokan.or.jp/pdf/shidosho/aikido/Aikido-02.pdf", page: "14-24" }
  - categorie: "Fondamentaux listés avec le 5e kyu"
    referentiel: "FLAM (Luxembourg), 2011, à titre indicatif"
    attaque: "Katate dori (exemple de sotai dosa)"
    techniques: ["Ukemi waza : travail des chutes", "Shikko : déplacements à genoux", "Tai sabaki : mouvement essentiel de base", "Sotai dosa (ex. katate dori – tai sabaki)"]
    source: { ref: "FLAM, Commission des grades, Annexe 2.1 Passages de grades KYU (oct. 2011)", url: "https://flam.lu/aikido/wp-content/uploads/sites/2/2020/11/AIKIDO-Passages-de-grades-KYU.pdf", page: "4/18" }
  - categorie: "Fondamentaux listés avec le 5e kyu"
    referentiel: "FFAAA, exemple de progression (non normatif)"
    attaque: null
    techniques: ["Shikko (déplacement)"]
    source: { ref: "FFAAA, Guide du débutant, Exemples de progression pour les grades kyu", url: "http://www.aikido-idf-ffaaa.fr/media/2019/02/aikido-ffaaa-guide-debutant.pdf", page: "18" }
  - categorie: "Formes d'attaque à connaître (nomenclature)"
    referentiel: "CSDGE (nomenclature des examens dan) / FFAAA (positions relatives)"
    attaque: "Ai hanmi katate dori ; katate dori (gyaku hanmi) ; shomen uchi"
    techniques: []
    note: "Ce sont les attaques du 5e kyu FFAB ; les nommer correctement (tori ET uke) est un critère dès le shodan."
    source: { ref: "CSDGE Livre 2, Annexe II §3 Kogekiho ; FFAAA-GUIDE Formes d'attaques", url: "https://aikido.com.fr/wp-content/uploads/2026/01/2025_12_31_CSDGE_AIKIDO_Livre2_reglementations_techniques.pdf", page: "CSDGE p. 18 ; FFAAA p. 7-8" }

competences:
  - "Saluer en montant et en quittant le tapis, et en direction du shomen / du portrait du fondateur (FFAAA-GUIDE p. 16)."
  - "Commencer le cours par « onegai shimasu » et le finir par « arigato gozaimashita » (BUDOKAN-I ; FFAAA-GUIDE p. 17)."
  - "S'asseoir en seiza, saluer en zarei, attendre en seiza (BUDOKAN-II ; FFAAA-GUIDE règles 5, 7, 11)."
  - "Arriver en retard : attendre au bord du tapis le signe de l'enseignant (FFAAA-GUIDE règle 6)."
  - "Tenue propre, pas de bijoux, armes rangées, ne pas emprunter le gi ou les armes d'autrui (FFAAA-GUIDE règles 3, 4, 21)."
  - "Comprendre les rôles : tori exécute, uke attaque et chute ; on alterne gauche/droite et les rôles (AIK-WHAT ; BUDOKAN-I)."
  - "Comprendre que l'aïkido n'a pas de compétition (AIK-WHAT-EN ; FFAAA-GUIDE p. 5)."
  - "Savoir ce qu'est un hanmi, ai hanmi, gyaku hanmi (BUDOKAN-II/-VII)."
  - "Connaître le sens des chutes : se protéger et se relever vite ; en pratique à deux, chuter sous l'action du partenaire et non de soi-même (BUDOKAN-II §4)."
  - "Savoir que les kyu sont délivrés en club par l'enseignant (FFAB-KYU ; FFAAA-GRADES)."
  - "Compter de un à dix en japonais (FFAAA-GUIDE p. 24 ; NWU-GLOSS)."

criteresEvaluation:
  - "Aucun critère publié pour le 6e kyu."
  - "À titre d'orientation seulement : la CSDGE évalue dès l'entrée dans le dojo le respect (reigisaho), la sérénité, la vigilance, l'attitude (shisei) — CSDGE-L2 Annexe I p. 7. Ne pas présenter comme critère du 6e kyu."

