# Terminologie vérifiée d'Aikido Lingo. Rédigé le 2026-10-19.
# Codes de source : voir content/referentiel/sources.md.
# Règles :
#  - kanji renseigné UNIQUEMENT s'il figure tel quel dans une source consultée (forme shinjitai : 気 et non 氣) ;
#  - « composition » dans la note = kanji assemblé à partir d'éléments tous attestés, mais forme complète non lue telle quelle ;
#  - pas de champ kanji = kanji non trouvé dans une source consultée (ne pas l'inventer) ;
#  - romanisation : Hepburn modifié, sans macron (cf. CLAUDE.md) ;
#  - sens : paraphrase française (CSDGE-L2, FFAAA-GUIDE, Budokan, Aikikai, NWU-GLOSS).
# Sources principales des kanji : AIK-EXAM-JA (tableau d'examen du Hombu Dojo), BUDOKAN-II/-VII, NWU-GLOSS.

termes:
  # ---------------------------------------------------------------- attaques (kogekiho)
  - id: kogekiho
    romaji: "kogekiho"
    sens: "formes d'attaque (terme utilisé par la nomenclature CSDGE)"
    categorie: attaque
    note: "Kanji non vérifié."
    source: "CSDGE-L2 p. 18"
  - id: katate-dori
    romaji: "katate dori"
    kanji: "片手取"
    sens: "saisie d'un poignet par une main"
    categorie: attaque
    note: "Le Budokan écrit 片手取り. Dans la nomenclature CSDGE, « katate dori » seul désigne la saisie en gyaku hanmi."
    source: "AIK-EXAM-JA ; BUDOKAN-II ; CSDGE-L2 p. 18"
  - id: ai-hanmi-katate-dori
    romaji: "ai hanmi katate dori"
    kanji: "相半身片手取り"
    sens: "saisie du poignet en garde identique (main droite sur main droite ou gauche sur gauche)"
    categorie: attaque
    note: "Composition de 相半身 et 片手取り (BUDOKAN-II/-VII). CSDGE écrit « aihanmi katate dori »."
    source: "CSDGE-L2 p. 18 ; FFAAA-GUIDE p. 7 ; BUDOKAN-VII"
  - id: gyaku-hanmi-katate-dori
    romaji: "gyaku hanmi katate dori"
    kanji: "逆半身片手取り"
    sens: "saisie du poignet en garde inversée (main droite sur poignet gauche, ou l'inverse)"
    categorie: attaque
    source: "BUDOKAN-II (逆半身片手取り四方投げ) ; CSDGE-L2 p. 18"
  - id: ryote-dori
    romaji: "ryote dori"
    kanji: "両手取"
    sens: "saisie des deux poignets par les deux mains"
    categorie: attaque
    source: "AIK-EXAM-JA ; CSDGE-L2 p. 18 ; FFAAA-GUIDE p. 7"
  - id: morote-dori
    romaji: "morote dori"
    kanji: "諸手取"
    sens: "saisie d'un seul avant-bras par les deux mains"
    categorie: attaque
    note: "Synonyme CSDGE : katate ryote dori. L'Aikikai précise « two hands holding one hand »."
    source: "AIK-EXAM-JA ; AIK-EXAM-EN ; CSDGE-L2 p. 18"
  - id: katate-ryote-dori
    romaji: "katate ryote dori"
    sens: "un poignet saisi par les deux mains (= morote dori)"
    categorie: attaque
    note: "Kanji de la forme « katate ryote dori » non vérifié ; voir morote dori."
    source: "CSDGE-L2 p. 18 ; FFAAA-GUIDE p. 7"
  - id: kata-dori
    romaji: "kata dori"
    kanji: "肩取"
    sens: "saisie à l'épaule (du keikogi, au niveau de l'épaule)"
    categorie: attaque
    source: "AIK-EXAM-JA ; CSDGE-L2 p. 18 ; FFAAA-GUIDE p. 22 (KATA : épaules)"
  - id: kata-dori-men-uchi
    romaji: "kata dori men uchi"
    sens: "saisie à l'épaule suivie d'une frappe de face à la tête"
    categorie: attaque
    note: "Kanji non vérifié. CSDGE écrit « kata dori men uchi » ; FFAB « kata dori menuchi »."
    source: "CSDGE-L2 p. 18 ; FFAB-KYU"
  - id: muna-dori
    romaji: "muna dori"
    sens: "saisie du revers du keikogi à la poitrine"
    categorie: attaque
    note: "Kanji de la forme complète non vérifié (胸 « poitrine » apparaît dans AIK-EXAM-JA). Le glossaire FFAAA écrit « mune dori : saisie du revers »."
    source: "CSDGE-L2 p. 18 ; FFAAA-GUIDE p. 23"
  - id: ryokata-dori
    romaji: "ryokata dori"
    sens: "saisie des deux épaules"
    categorie: attaque
    note: "Kanji non vérifié."
    source: "CSDGE-L2 p. 18 ; FFAAA-GUIDE p. 7"
  - id: shomen-uchi
    romaji: "shomen uchi"
    kanji: "正面打"
    sens: "frappe verticale de face, au sommet de la tête, avec le tranchant de la main"
    categorie: attaque
    note: "Budokan : 正面打ち."
    source: "AIK-EXAM-JA ; BUDOKAN-II ; CSDGE-L2 p. 18"
  - id: yokomen-uchi
    romaji: "yokomen uchi"
    kanji: "横面打"
    sens: "frappe oblique sur le côté de la tête"
    categorie: attaque
    note: "NWU : 横面打ち."
    source: "AIK-EXAM-JA ; NWU-GLOSS ; CSDGE-L2 p. 18"
  - id: tsuki
    romaji: "tsuki"
    kanji: "突き"
    sens: "coup direct de face (poing ou arme)"
    categorie: attaque
    note: "AIK-EXAM-JA écrit 突."
    source: "AIK-EXAM-JA ; NWU-GLOSS ; FFAAA-GUIDE p. 24"
  - id: chudan-tsuki
    romaji: "chudan tsuki"
    kanji: "中段突き"
    sens: "coup de poing direct au niveau moyen (ventre)"
    categorie: attaque
    note: "Composition : 中段 (NWU, « chudan no kamae ») + 突き."
    source: "CSDGE-L2 p. 18 ; NWU-GLOSS"
  - id: jodan-tsuki
    romaji: "jodan tsuki"
    kanji: "上段突き"
    sens: "coup de poing direct au niveau haut (visage)"
    categorie: attaque
    note: "Composition : 上段 (NWU, « jodan no kamae ») + 突き. FFAAA : JODAN = niveau haut."
    source: "CSDGE-L2 p. 18 ; NWU-GLOSS ; FFAAA-GUIDE p. 22"
  - id: mae-geri
    romaji: "mae geri"
    sens: "coup de pied direct de face"
    categorie: attaque
    note: "Kanji non vérifié. Figure au 1er kyu FFAB et FLAM ; absent de la liste CSDGE des formes d'attaque."
    source: "FFAAA-GUIDE p. 23 ; FFAB-KYU"
  - id: ushiro-ryote-dori
    romaji: "ushiro ryote dori"
    kanji: "後両手取"
    sens: "saisie des deux poignets par l'arrière"
    categorie: attaque
    source: "AIK-EXAM-JA ; CSDGE-L2 p. 18"
  - id: ushiro-ryokata-dori
    romaji: "ushiro ryokata dori"
    sens: "saisie des deux épaules par l'arrière"
    categorie: attaque
    note: "Kanji non vérifié."
    source: "CSDGE-L2 p. 18"
  - id: ushiro-eri-dori
    romaji: "ushiro eri dori"
    sens: "saisie du col par l'arrière"
    categorie: attaque
    note: "Kanji non vérifié. L'Aikikai cite les saisies au col (« collar ») au shodan."
    source: "CSDGE-L2 p. 18 ; AIK-EXAM-EN"
  - id: ushiro-ryohiji-dori
    romaji: "ushiro ryohiji dori"
    sens: "saisie des deux coudes par l'arrière"
    categorie: attaque
    note: "Kanji non vérifié."
    source: "CSDGE-L2 p. 18 ; FFAAA-GUIDE p. 7"
  - id: ushiro-katate-dori-kubi-shime
    romaji: "ushiro katate dori kubi shime"
    sens: "par l'arrière, saisie d'un poignet et étranglement du cou avec l'autre bras"
    categorie: attaque
    note: "Kanji non vérifié. FFAB et FLAM écrivent « katate dori kubishime ». FFAAA : KUBI = cou."
    source: "CSDGE-L2 p. 18 ; FFAAA-GUIDE p. 8, p. 22"
  - id: futari-dori
    romaji: "futari dori"
    sens: "saisie simultanée par deux partenaires"
    categorie: attaque
    note: "Kanji de « futari dori » non vérifié ; voir futari gake (二人掛)."
    source: "CSDGE-L2 p. 18"
  - id: futari-gake
    romaji: "futari gake"
    kanji: "二人掛"
    sens: "travail contre deux partenaires"
    categorie: attaque
    note: "Budokan : 二人掛け. CSDGE emploie aussi « niningake »."
    source: "AIK-EXAM-JA ; BUDOKAN-VII ; CSDGE-L2 p. 10"
  - id: taninzu-gake
    romaji: "taninzu gake"
    kanji: "多人数掛"
    sens: "travail contre plusieurs partenaires"
    categorie: attaque
    note: "CSDGE : « Taninzu gake » ; « saningake » = trois partenaires."
    source: "AIK-EXAM-JA ; CSDGE-L2 p. 18"
  - id: atemi
    romaji: "atemi"
    kanji: "当身"
    sens: "coup porté au corps ; pour tori, moyen de déséquilibrer ou de provoquer une réaction, pas une fin en soi"
    categorie: attaque
    source: "NWU-GLOSS ; JAWIKI ; CSDGE-L2 p. 9"

  # ---------------------------------------------------------------- techniques
  - id: ikkyo
    romaji: "ikkyo"
    kanji: "一教"
    sens: "« premier principe » : contrôle du bras par le coude et le poignet, amenant uke au sol face contre terre"
    categorie: technique
    note: "Le Budokan écrit 第一教 (dai ikkyo). Famille katame waza (CSDGE)."
    source: "AIK-EXAM-JA ; BUDOKAN-II ; CSDGE-L2 p. 19"
  - id: nikyo
    romaji: "nikyo"
    kanji: "二教"
    sens: "« deuxième principe » : immobilisation par torsion du poignet"
    categorie: technique
    note: "FFAB écrit parfois « nikkyo »."
    source: "AIK-EXAM-JA ; CSDGE-L2 p. 19"
  - id: sankyo
    romaji: "sankyo"
    kanji: "三教"
    sens: "« troisième principe » : immobilisation par torsion du poignet et de l'avant-bras"
    categorie: technique
    source: "AIK-EXAM-JA ; CSDGE-L2 p. 19"
  - id: yonkyo
    romaji: "yonkyo"
    kanji: "四教"
    sens: "« quatrième principe » : immobilisation par pression sur l'avant-bras"
    categorie: technique
    source: "AIK-EXAM-JA ; CSDGE-L2 p. 19"
  - id: gokyo
    romaji: "gokyo"
    kanji: "五教"
    sens: "« cinquième principe » : immobilisation du bras, notamment contre une attaque armée"
    categorie: technique
    note: "Au tanto dori, l'exemple CSDGE de sandan/yondan demande gokyo sur shomen uchi et tsuki."
    source: "AIK-EXAM-JA ; CSDGE-L2 p. 19, p. 30"
  - id: shiho-nage
    romaji: "shiho nage"
    kanji: "四方投げ"
    sens: "« projection dans les quatre directions »"
    categorie: technique
    note: "FFAAA écrit « shihoo nage » ; CSDGE « shihonage »."
    source: "AIK-EXAM-JA ; BUDOKAN-II ; CSDGE-L2 p. 19"
  - id: irimi-nage
    romaji: "irimi nage"
    kanji: "入身投げ"
    sens: "projection en entrant (irimi) sur le côté de uke"
    categorie: technique
    note: "Forme « sokumen » citée par CSDGE."
    source: "AIK-EXAM-JA ; BUDOKAN-II ; CSDGE-L2 p. 19"
  - id: kote-gaeshi
    romaji: "kote gaeshi"
    kanji: "小手返し"
    sens: "projection par retournement du poignet (kote : dos de la main / poignet)"
    categorie: technique
    note: "Classée à la fois en nage waza et en nage katame waza par CSDGE."
    source: "AIK-EXAM-JA ; BUDOKAN-VII (小手) ; CSDGE-L2 p. 19"
  - id: kaiten-nage
    romaji: "kaiten nage"
    kanji: "回転投げ"
    sens: "projection en rotation ; formes uchi (intérieure) et soto (extérieure)"
    categorie: technique
    note: "uchi 内 / soto 外 (NWU)."
    source: "AIK-EXAM-JA ; NWU-GLOSS ; CSDGE-L2 p. 19"
  - id: tenchi-nage
    romaji: "tenchi nage"
    kanji: "天地投げ"
    sens: "projection « ciel et terre » (une main monte, l'autre descend)"
    categorie: technique
    source: "AIK-EXAM-JA ; CSDGE-L2 p. 19"
  - id: koshi-nage
    romaji: "koshi nage"
    kanji: "腰投げ"
    sens: "projection de hanche"
    categorie: technique
    note: "FFAAA : « projection de hanches »."
    source: "JAWIKI ; CSDGE-L2 p. 19 ; FFAAA-GUIDE p. 12"
  - id: juji-garami
    romaji: "juji garami"
    sens: "projection en croisant les bras de uke"
    categorie: technique
    note: "Kanji non vérifié. FFAB écrit « jugi garami » ; CSDGE « jujigarami »."
    source: "CSDGE-L2 p. 19 ; FFAAA-GUIDE p. 12"
  - id: ude-kime-nage
    romaji: "ude kime nage"
    sens: "projection par contrôle du bras tendu (coude)"
    categorie: technique
    note: "Kanji non vérifié. CSDGE : « udekimenage »."
    source: "CSDGE-L2 p. 19 ; FFAAA-GUIDE p. 12"
  - id: sumi-otoshi
    romaji: "sumi otoshi"
    kanji: "隅落し"
    sens: "« chute dans l'angle » ; projection sur le côté en balayant la jambe (définition CSDGE)"
    categorie: technique
    source: "JAWIKI ; CSDGE-L2 p. 19"
  - id: kokyu-nage
    romaji: "kokyu nage"
    kanji: "呼吸投げ"
    sens: "famille de projections fondées sur le rythme, sans contrainte sur les articulations"
    categorie: technique
    note: "Appellation générique (FFAAA)."
    source: "JAWIKI ; FFAAA-GUIDE p. 12 ; CSDGE-L2 p. 19"
  - id: kokyu-ho
    romaji: "kokyu ho"
    kanji: "呼吸法"
    sens: "exercice de respiration/coordination, souvent pratiqué assis (suwari waza) en fin de cours"
    categorie: technique
    note: "FFAAA écrit « kokyu hoo ». Aikikai : 呼吸法 en 座技 à tous les kyu."
    source: "AIK-EXAM-JA ; FFAAA-GUIDE p. 22 ; JAWIKI"
  - id: hiji-kime-osae
    romaji: "hiji kime osae"
    sens: "immobilisation par contrôle du coude"
    categorie: technique
    note: "Kanji non vérifié. CSDGE : « hijikimeosae » (katame waza)."
    source: "CSDGE-L2 p. 19"
  - id: ude-garami
    romaji: "ude garami"
    sens: "immobilisation par enroulement du bras"
    categorie: technique
    note: "Kanji non vérifié."
    source: "CSDGE-L2 p. 19 ; FFAAA-GUIDE p. 11"
  - id: aiki-otoshi
    romaji: "aiki otoshi"
    sens: "projection en soulevant les jambes de uke par l'arrière"
    categorie: technique
    note: "Kanji non vérifié. Sens descriptif non tiré d'une définition officielle : à faire relire."
    source: "CSDGE-L2 p. 25 ; FFAAA-GUIDE p. 12"
  - id: ushiro-kiri-otoshi
    romaji: "ushiro kiri otoshi"
    sens: "projection en « coupant » vers l'arrière"
    categorie: technique
    note: "Kanji non vérifié. FFAAA : KIRI = coupe."
    source: "CSDGE-L2 p. 19 ; FFAAA-GUIDE p. 22"
  - id: sokumen-irimi-nage
    romaji: "sokumen irimi nage"
    kanji: "側面入身投げ"
    sens: "irimi nage par le côté (forme latérale)"
    categorie: technique
    note: "Composition : 側面 (NWU) + 入身投げ. CSDGE l'assimile à « naname kokyunage » sur ryokata dori."
    source: "CSDGE-L2 p. 19, p. 23 ; NWU-GLOSS"
  - id: omote-waza
    romaji: "omote waza / ura waza"
    kanji: "表技・裏技"
    kana: "おもてわざ・うらわざ"
    sens: "même technique exécutée en entrant côté ventre de uke (omote) ou en passant côté dos (ura)"
    categorie: technique
    source: "BUDOKAN-VII"
  - id: nage-waza
    romaji: "nage waza"
    sens: "techniques de projection"
    categorie: technique
    note: "Kanji de l'expression non vérifié (投げ et 技 attestés séparément par NWU)."
    source: "CSDGE-L2 p. 17"
  - id: katame-waza
    romaji: "katame waza"
    sens: "techniques de contrôle ou d'immobilisation"
    categorie: technique
    note: "Kanji non vérifié. FFAAA emploie aussi « osae waza »."
    source: "CSDGE-L2 p. 17 ; FFAAA-GUIDE p. 9"
  - id: nage-katame-waza
    romaji: "nage katame waza"
    sens: "projection suivie d'un contrôle"
    categorie: technique
    note: "Kanji non vérifié."
    source: "CSDGE-L2 p. 17"
  - id: jiyu-waza
    romaji: "jiyu waza"
    kanji: "自由技"
    sens: "techniques libres sur une attaque donnée"
    categorie: technique
    note: "CSDGE écrit « jyuwaza », FFAAA « ju waza ». Mode d'interrogation utilisable à tout moment (CSDGE)."
    source: "AIK-EXAM-JA ; CSDGE-L2 p. 20"
  - id: henka-waza
    romaji: "henka waza"
    kanji: "変化技"
    sens: "variations et enchaînements à partir d'une technique de base"
    categorie: technique
    source: "NWU-GLOSS ; CSDGE-L2 p. 13 ; FFAAA-GUIDE p. 15"
  - id: kaeshi-waza
    romaji: "kaeshi waza"
    kanji: "返し技"
    sens: "contre-techniques (uke retourne la technique de tori)"
    categorie: technique
    source: "NWU-GLOSS ; FFAAA-GUIDE p. 15"

  # ---------------------------------------------------------------- formes de travail / positions
  - id: suwari-waza
    romaji: "suwari waza"
    kanji: "座技"
    sens: "techniques où les deux partenaires sont à genoux (à partir de seiza)"
    categorie: position
    note: "L'Aikikai lit aussi « zagi ». CSDGE : « suwariwaza »."
    source: "AIK-EXAM-JA ; AIK-EXAM-EN ; CSDGE-L2 p. 17"
  - id: hanmi-handachi-waza
    romaji: "hanmi handachi waza"
    kanji: "半身半立"
    sens: "tori à genoux, uke debout"
    categorie: position
    note: "NWU : 半身半立技 (hanmi hantachi waza)."
    source: "AIK-EXAM-JA ; NWU-GLOSS ; CSDGE-L2 p. 17"
  - id: tachi-waza
    romaji: "tachi waza"
    kanji: "立技"
    sens: "techniques debout"
    categorie: position
    source: "AIK-EXAM-JA ; CSDGE-L2 p. 17"
  - id: ushiro-waza
    romaji: "ushiro waza"
    sens: "techniques sur attaques par l'arrière"
    categorie: position
    note: "ushiro 後ろ (NWU) ; kanji de l'expression complète non vérifié."
    source: "CSDGE-L2 p. 10 ; NWU-GLOSS"
  - id: seiza
    romaji: "seiza"
    kanji: "正座"
    sens: "position assise à genoux, sur les talons ; posture de base du salut assis"
    categorie: position
    source: "BUDOKAN-II ; NWU-GLOSS ; CSDGE-L2 p. 17"
  - id: kiza
    romaji: "kiza"
    kanji: "跪座"
    sens: "seiza avec les orteils retournés (pointe des pieds au sol), position de départ du shikko"
    categorie: position
    source: "BUDOKAN-II"
  - id: shikko
    romaji: "shikko"
    kanji: "膝行"
    sens: "déplacement à genoux"
    categorie: position
    note: "Forme longue : shikkō."
    source: "BUDOKAN-II ; NWU-GLOSS ; FLAM-KYU-2011 p. 4"
  - id: kamae
    romaji: "kamae"
    kanji: "構え"
    sens: "garde ; pour la CSDGE aussi l'état de vigilance qui précède l'engagement"
    categorie: position
    source: "BUDOKAN-II ; NWU-GLOSS ; CSDGE-L2 p. 8"
  - id: hanmi
    romaji: "hanmi"
    kanji: "半身"
    kana: "はんみ"
    sens: "position asymétrique, une jambe en avant (migi hanmi : pied droit devant ; hidari hanmi : pied gauche devant)"
    categorie: position
    source: "BUDOKAN-II ; BUDOKAN-VII ; CSDGE-L2 p. 8"
  - id: ai-hanmi
    romaji: "ai hanmi"
    kanji: "相半身"
    kana: "あいはんみ"
    sens: "tori et uke ont le même pied en avant"
    categorie: position
    note: "NWU écrit 合半身."
    source: "BUDOKAN-VII ; NWU-GLOSS"
  - id: gyaku-hanmi
    romaji: "gyaku hanmi"
    kanji: "逆半身"
    kana: "ぎゃくはんみ"
    sens: "tori et uke ont des pieds opposés en avant"
    categorie: position
    source: "BUDOKAN-VII ; NWU-GLOSS"

  # ---------------------------------------------------------------- concepts
  - id: omote
    romaji: "omote"
    kanji: "表"
    sens: "l'endroit, la face visible ; forme qui entre devant uke (plutôt logique de pression, CSDGE)"
    categorie: concept
    source: "CSDGE-L2 p. 8-9 ; BUDOKAN-VII ; FFAAA-GUIDE p. 13"
  - id: ura
    romaji: "ura"
    kanji: "裏"
    sens: "l'envers, la face cachée ; forme qui passe derrière uke (plutôt logique de contournement, CSDGE)"
    categorie: concept
    source: "CSDGE-L2 p. 8-9 ; BUDOKAN-VII ; FFAAA-GUIDE p. 13"
  - id: irimi
    romaji: "irimi"
    kanji: "入身"
    sens: "entrer, pénétrer dans la garde de uke ; élément fondamental du placement initial"
    categorie: concept
    source: "CSDGE-L2 p. 8 ; BUDOKAN-II ; NWU-GLOSS ; AIK-DOSHU-EN"
  - id: tenkan
    romaji: "tenkan"
    kanji: "転換"
    sens: "pivot qui efface le corps devant l'action de uke, sans changer de hanmi ; complément d'irimi"
    categorie: concept
    source: "CSDGE-L2 p. 8 ; BUDOKAN-II ; NWU-GLOSS"
  - id: tai-sabaki
    romaji: "tai sabaki"
    kanji: "体さばき"
    sens: "déplacement du corps en réponse à l'attaque, qui crée l'ouverture et le déséquilibre"
    categorie: concept
