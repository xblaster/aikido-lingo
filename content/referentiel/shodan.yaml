conditions:   # CSDGE-L1 tableau art. 2.2.1 p. 11 et art. 2.6 p. 15
  - "Grade précédent : 1er kyu ; âge minimum révolu 15 ans (autorisation parentale si mineur)."
  - "Temps minimum en tant que licencié : 1 an ; 3 licences minimum (lecture du tableau à faire relire : mise en page en colonnes)."
  - "Dossier : certificat médical de moins d'un an ; preuve d'au moins 3 stages fédéraux FFAB/FFAAA dans les 12 mois ; envoi à la ligue au moins 2 mois avant l'examen."
  - "Variante FLAM : 15 ans, 1 an depuis le 1er kyu, 40 h de stage (20 h FLAM + 20 h divers) depuis le 6e kyu (FLAM-CFG-2015 p. 7)."
  - "Variante Aikikai : 70 jours de pratique après le 1er kyu, 15 ans minimum (AIK-EXAM-EN)."
deroulement:   # CSDGE-L2 p. 4 et p. 10
  - "Prestation de 15 minutes (± 3 min). Partenaire choisi parmi les candidats ; après au moins 4 minutes, le jury désigne d'autres partenaires."
  - "Notation sur 20 : composante 1 (/12) connaissance formelle et réalisation des techniques selon principes et fondations ; composante 2 (/8) attitude comme tori et uke, zanshin, reishiki, cadre de l'examen. 10/20 suffit."
