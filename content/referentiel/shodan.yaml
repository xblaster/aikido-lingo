notesProgramme:
  - "« prioritaires » = techniques soulignées dans la liste CSDGE p. 21-26 (relevé par analyse du PDF, vérifié visuellement p. 23). Kata dori nikyo / kokyu nage : seul « KATA » souligné, statut ambigu."
  - "La nomenclature (CSDGE-L2 p. 17-19) liste les formes d'attaque et techniques ; elle ne délimite pas l'enseignement. Le candidat est censé tout connaître dès le 1er dan, mais l'interrogation porte sur les fondamentaux (p. 20)."
  - "Exemple d'interrogation shodan : CSDGE-L2 p. 27 (à retranscrire : À COMPLÉTER)."
