competences:   # CSDGE-L2 p. 10 « capacités à vérifier »
  - "Respecter le cadre de l'examen."
  - "Connaître la nomenclature des techniques et des formes d'attaque, comme tori et comme uke."
  - "Comprendre la logique de construction des techniques ; attention portée à l'attitude et au centrage (shisei)."
  - "Les autres éléments d'évaluation doivent « apparaître en germe »."
criteresEvaluation:   # CSDGE-L2 Annexe I p. 7-9 (paraphrase)
  - "Respect (reigisaho), sérénité, concentration, vigilance (kamae, zanshin), détermination (kiryoku)."
  - "Attitude (shisei), unité du corps, équilibre, relâchement, condition physique."
  - "Connaissance de la nomenclature, dont omote/ura."
  - "Logique de construction : déséquilibre issu d'un placement initial (de ai) adéquat ; gestion du ma ai ; principe irimi."
  - "Atemi potentiels, absence d'ouverture, pertinence des déplacements (tai sabaki, irimi, tenkan)."
  - "Connexion (kimusubi, awase), disponibilité, caractère non traumatisant de la technique."
  - "Évaluation pendant toute la présence dans le dojo (montée sur le tapis, saluts, attente)."
