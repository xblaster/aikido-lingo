  source:
    type: aikikai
    ref: AIK-EXAM-JA ; AIK-EXAM-EN ; CSDGE-L2 p. 17
    consulte: 2026-10-19
- id: hanmi-handachi-waza
  romaji: hanmi handachi waza
  kanji: 半身半立
  sens: tori à genoux, uke debout
  categorie: position
  note: "NWU : 半身半立技 (hanmi hantachi waza)."
  source:
    type: aikikai
    ref: AIK-EXAM-JA ; NWU-GLOSS ; CSDGE-L2 p. 17
    consulte: 2026-10-19
- id: tachi-waza
  romaji: tachi waza
  kanji: 立技
  sens: techniques debout
  categorie: position
  source:
    type: aikikai
    ref: AIK-EXAM-JA ; CSDGE-L2 p. 17
    consulte: 2026-10-19
- id: ushiro-waza
  romaji: ushiro waza
  sens: techniques sur attaques par l'arrière
  categorie: position
  note: ushiro 後ろ (NWU) ; kanji de l'expression complète non vérifié.
  source:
    type: officiel
    ref: CSDGE-L2 p. 10 ; NWU-GLOSS
    consulte: 2026-10-19
- id: seiza
  romaji: seiza
  kanji: 正座
  sens: position assise à genoux, sur les talons ; posture de base du salut assis
  categorie: position
  source:
    type: ouvrage
    ref: BUDOKAN-II ; NWU-GLOSS ; CSDGE-L2 p. 17
    consulte: 2026-10-19
- id: kiza
  romaji: kiza
  kanji: 跪座
  sens: seiza avec les orteils retournés (pointe des pieds au sol), position de départ du shikko
  categorie: position
  source:
    type: ouvrage
    ref: BUDOKAN-II
    consulte: 2026-10-19
- id: shikko
  romaji: shikko
  kanji: 膝行
  sens: déplacement à genoux
  categorie: position
  note: "Forme longue : shikkō."
  source:
    type: ouvrage
    ref: BUDOKAN-II ; NWU-GLOSS ; FLAM-KYU-2011 p. 4
    consulte: 2026-10-19
